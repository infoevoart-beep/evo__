<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14110F" />
    <title>Hillsedge Beragala — Mountain Smokehouse &amp; Dining Experience</title>
    <meta
      name="description"
      content="A mountain smokehouse and dining destination in Beragala, Sri Lanka. Slow smoke, handcrafted flavour and hill-country views, 1,000m above the sea."
    />
    <meta property="og:title" content="Hillsedge Beragala — Mountain Smokehouse &amp; Dining" />
    <meta
      property="og:description"
      content="Slow smoke, mountain air. A smokehouse dining destination in Sri Lanka's hill country."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint. A plain `rel="stylesheet"` here
      holds the render tree hostage: when fonts.googleapis.com is slow or
      unreachable the page stays blank until the request times out — measured
      at over 12s against a hanging host, versus 28ms without it.

      `media="print"` keeps the sheet out of the render path while the preload
      above fetches it at high priority; src/main.jsx flips it to `all` on
      startup. The swap lives in the bundle rather than an inline `onload`
      handler so that script-src in the Content-Security-Policy can stay
      'self' with no 'unsafe-inline'.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" data-webfont />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
